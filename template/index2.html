<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MAX-UI secure admin login" />
  <title>MAX-UI Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="login-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="grid-background" aria-hidden="true"></div>
    <div class="particles" aria-hidden="true">
      <span style="--x:8%;--y:28%;--d:0s"></span>
      <span style="--x:14%;--y:67%;--d:1.2s"></span>
      <span style="--x:24%;--y:18%;--d:2.4s"></span>
      <span style="--x:35%;--y:76%;--d:1.8s"></span>
      <span style="--x:61%;--y:22%;--d:.7s"></span>
      <span style="--x:72%;--y:73%;--d:2.8s"></span>
      <span style="--x:87%;--y:33%;--d:1.5s"></span>
      <span style="--x:92%;--y:68%;--d:3.2s"></span>
    </div>

    <section class="login-card" aria-label="MAX-UI login">
      <div class="showcase-panel">
        <div class="brand-block">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M32 5 53 13v16c0 14-8.7 24.8-21 30C19.7 53.8 11 43 11 29V13L32 5Z"/>
              <rect x="24" y="29" width="16" height="14" rx="3"/>
              <path d="M27 29v-5a5 5 0 0 1 10 0v5"/>
            </svg>
          </div>

          <h1><span>MAX-</span>UI</h1>
          <p>Secure. Fast. Powerful.</p>
        </div>

        <div class="server-art" aria-hidden="true">
          <div class="server-stack">
            <div class="server-unit">
              <span></span><span></span><i></i>
            </div>
            <div class="server-unit">
              <span></span><span></span><i></i>
            </div>
            <div class="server-unit">
              <span></span><span></span><i></i>
            </div>
          </div>

          <div class="security-shield">
            <svg viewBox="0 0 64 76">
              <path d="M32 4 57 14v19c0 18-10.4 31.6-25 39C17.4 64.6 7 51 7 33V14L32 4Z"/>
              <path class="check" d="m20 38 8 8 17-21"/>
            </svg>
          </div>

          <div class="platform">
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="features">
          <article>
            <div class="feature-icon">
              <svg viewBox="0 0 24 24">
                <path d="M12 3 20 6v6c0 5-3.3 8.4-8 10-4.7-1.6-8-5-8-10V6l8-3Z"/>
                <path d="m8.5 12 2.2 2.2 4.8-5"/>
              </svg>
            </div>
            <strong>Secure</strong>
            <span>Top-level security</span>
          </article>

          <article>
            <div class="feature-icon">
              <svg viewBox="0 0 24 24">
                <path d="m13 2-8 12h6l-1 8 9-13h-6V2Z"/>
              </svg>
            </div>
            <strong>Fast</strong>
            <span>Optimized for speed</span>
          </article>

          <article>
            <div class="feature-icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 20v-7h4v7M10 20V9h4v11M16 20V4h4v16"/>
              </svg>
            </div>
            <strong>Powerful</strong>
            <span>Built for performance</span>
          </article>
        </div>
      </div>

      <div class="form-panel">
        <button class="theme-button" type="button" aria-label="Theme selector">
          <svg viewBox="0 0 24 24">
            <path d="M20 15.2A8 8 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/>
          </svg>
          <span>Dark Mode</span>
          <span class="chevron">⌄</span>
        </button>

        <div class="form-content">
          <header class="form-heading">
            <span class="eyebrow">SECURE ACCESS</span>
            <h2>Welcome Back</h2>
            <p>Please sign in to continue to your account.</p>
          </header>

          <form action="#" method="post">
            <div class="field">
              <label for="username">Username</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21a8 8 0 0 1 16 0"/>
                  </svg>
                </span>
                <input
                  id="username"
                  name="username"
                  type="text"
                  placeholder="Enter your username"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="5" y="10" width="14" height="11" rx="2"/>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                  </svg>
                </span>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <span class="eye-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </span>
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox">
                <input type="checkbox" name="remember" checked />
                <span class="checkmark"></span>
                <span>Remember me</span>
              </label>

              <a href="#">Forgot password?</a>
            </div>

            <button class="login-button" type="submit">
              <span>Log In</span>
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>

            <div class="divider"><span>OR</span></div>

            <button class="api-button" type="button">
              <svg viewBox="0 0 24 24">
                <path d="M12 3 20 6v6c0 5-3.3 8.4-8 10-4.7-1.6-8-5-8-10V6l8-3Z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
              <span>Login with API Key</span>
            </button>
          </form>

          <footer>© 2026 MAX-UI. All rights reserved.</footer>
        </div>
      </div>

      <div class="center-badge" aria-hidden="true">→</div>
    </section>
  </main>
</body>
</html>
