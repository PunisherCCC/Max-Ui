name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc libc6-dev

      - name: Download Go modules
        run: go mod download

      - name: Run focused regression tests
        run: |
          go test ./singbox -count=1
          go test ./web -run 'TestAllTemplatesParseAndProtocolFormsDefined|TestEditedTemplatesParse' -count=1
          go test ./web/service -run 'TestMultiplyDelta|TestFoldClientTrafficAppliesMultiplier|TestAddInboundTrafficAppliesMultiplier|TestInboundMultiplierColumnsRoundTrip' -count=1

      - name: Build panel binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/max-ui-amd64 main.go
          chmod +x dist/max-ui-amd64
          ./dist/max-ui-amd64 -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-ui-amd64
          path: dist/max-ui-amd64
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/max-ui-amd64
